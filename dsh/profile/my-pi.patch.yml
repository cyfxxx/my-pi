# my-pi 的 DSH profile 覆盖层（patch overlay）—— 把本仓插件插进一个 DSH profile
#
# ## 已验证的用法（隔离 DSH_HOME，只组合配置、**不启动**）
#
#   bash scripts/dsh-build.sh                       # 先产出 dsh/plugin/dist/my-pi-plugin.mjs
#   export DSH_HOME=/tmp/my-pi-dsh-home             # 用隔离的 home，别碰正在跑的 profile
#   dsh --profile mypi --from-default-profile headless --dump-config         # 从内置模板建 profile
#   dsh --profile mypi --patch <repo>/dsh/profile/my-pi.patch.yml --dump-config | grep -A3 my-pi
#
# 实测（2026-10-15，dsh 0.2.0-rc.2 / cordis 4.0.4）：
#   - id 形式的补丁会报 `entry "my-pi" not found`（那是**覆盖已有条目**的语义）；
#   - **插入新插件要用 `insert:`**，如下；`--dump-config` 会把它打印成
#     `name: file:///…/my-pi-plugin.mjs` ⇒ 真实 launcher 已接受该插件进 profile ✓。
#
# ## 说明
#
#   * DSH 的 patch 是**有序数组**：`name` 是插件模块 specifier，**相对路径以 patch 文件所在目录为锚点**。
#   * 产物只含本仓代码；第三方依赖见 dsh/plugin/package.json（仓库在本机时由本仓 node_modules 解析；
#     正式部署应把 `my-pi-dsh-plugin` 作为 profile 依赖安装）。
#   * ✗ 尚未做：Host 级真正启动（需要凭据/内存；且不得打扰正在运行的 dsh web）。
# ── （可选）移动端并发上限：**默认不启用**，需要时把下面两条取消注释 ────────────────────────
# 背景：宿主的 `maxActiveSubagents` 默认 8，而 my-pi 在 Termux/android 上刻意压到 2（手机内存小）。
# 它是 `Volatile<number>`（**只有其拥有者可写**）⇒ 插件改不动，只能：① 启动时**读出来并在超限时报警**
# （见 custom/adapters/dsh/subagent-capacity.ts，真 Host 日志里有一行 `[my-pi-dsh] subagent 并发：…`）；
# ② 由**部署方**在这里显式覆盖。注意：`- id:` 形式是"覆盖已有条目"，会**整体替换**该条目的 config，
# 所以这里把 schema 的另一个字段（maxDepth，默认 1）也写全，避免把别人的设置抹掉。
#
# - id: subagent
#   config:
#     maxActiveSubagents: 2
#     maxDepth: 1

# ── （可选）具名 agent 工具：**默认关闭**（能力审计 DR-2）───────────────────────────────
# 打开后，`<agent dir>/agents/*.md` 与 `<cwd>/.pi/agents/*.md` 里的每个 agent 会变成一个
# **模型可见工具**（工具名 = 规范化后的 agent 名），携带它的 persona 与工具权限
# （只读 agent 自动限到 read/grep/find/ls）。代价：工具面变大、token 变贵 ⇒ 默认关。
# ★ 注意：`- id:` 形式会**整体替换**该条目 config ⇒ 要保留上面的 `root` 等字段就一起写全。
# 临时启用（不改文件）：MY_PI_DSH_EXTRA_PATCH=/tmp/na.patch.yml ./my-pi.sh web
#
# - id: my-pi
#   config:
#     namedAgents:
#       enabled: true
#       maxTools: 3            # 上限（默认 6）；超出的逐条报"跳过原因"
#       scope: both            # user | project | both
#       provider: spawn        # 宿主 subagent 提供方
#
- insert:
    - id: my-pi
      name: "../plugin/dist/my-pi-plugin.mjs"
      config: {}
