# 本地小窗口专用 agent preset：只挂"读/写/跑/看网页"这几件工具
# （工具面由 preset 决定，这是 DSH 的正式机制；不用改上游、不用 disable hack）。
# 用法：MYPI_LEAN_TOOLS=1（host 追加本 patch）+ MYPI_AGENT_PRESET=local（session 创建时选它）。
- insert:
    - id: preset-local
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: local
        order: 1
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # 本地小窗口的预算：headroom 从默认 65536 降到 1024，否则 8K 窗口下
                  # pressureBudget 为负 ⇒ 永远不压缩（实测）。
                  thresholdRatio: 0.55
                  headroomTokens: 1024
                  retainTokens: 600
                  maxTokens: 1024
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
