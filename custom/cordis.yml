# my-pi 声明式配置
# 基于 DeepSeek Harness 的 cordis.yml 风格

# 扩展配置
extensions:
  # 核心扩展
  - id: pi-context
    enabled: true
    config:
      compression:
        strategy: aggressive
      toolLayering:
        enabled: true
      thinking:
        managed: true

  - id: plan-mode
    enabled: true
    config:
      enforcementLevel: strict
      overlay:
        enabled: true

  - id: pi-memory
    enabled: true
    config:
      autoExtract: true
      injection:
        maxTokens: 2000
      deduplication:
        enabled: true

  - id: pi-autopilot
    enabled: true
    config:
      scheduler:
        enabled: true
      watchdog:
        timeout: 300000
      telemetry:
        enabled: true

  # 外围扩展
  - id: pi-web-search
    enabled: true
    config:
      provider: searxng
      fallback: bing

  - id: pi-browser
    enabled: true
    config:
      browser: cloak
      headless: true

  - id: pi-intervention
    enabled: true
    config:
      snapshot: true
      corrective: true

  - id: pi-link
    enabled: false
    config:
      mode: ssh
      autoConnect: false

  - id: pi-tmux
    enabled: true
    config:
      sessions:
        maxActive: 5
      watcher:
        enabled: true

  - id: pi-mode
    enabled: true
    config:
      modes:
        - full
        - light
        - quick
      default: full

  - id: pi-voice
    enabled: false
    config:
      tts: enabled
      stt: whisper
      wakeWord: false

  - id: subagent
    enabled: true
    config:
      maxConcurrent: 3
      timeout: 60000

# 能力缝隙配置
seams:
  # Shell 缝隙
  - name: shell
    provider: local
    config:
      timeout: 120000
      maxBuffer: 10485760

  # 文件系统缝隙
  - name: fs
    provider: local
    config:
      encoding: utf-8
      maxFileSize: 10485760

  # 搜索缝隙
  - name: search
    provider: local
    config:
      maxResults: 200
      caseSensitive: false

  # 沙箱缝隙
  - name: sandbox
    provider: null
    config:
      allowedPaths:
        - /tmp
        - /usr
        - /bin
        - /lib
      deniedPaths: []

  # LLM 缝隙
  - name: llm
    provider: google
    config:
      model: gemini-2.0-flash
      temperature: 0.7
      maxTokens: 8192

  # 子代理缝隙
  - name: subagent
    provider: local
    config:
      maxConcurrent: 3
      timeout: 60000

  # 凭证缝隙
  - name: credentials
    provider: env
    config:
      prefix: PI_

  # 交互缝隙
  - name: interaction
    provider: terminal
    config:
      defaultTimeout: 30000

  # 设置缝隙
  - name: settings
    provider: file
    config:
      path: .pi/settings.json

  # 会话日志缝隙
  - name: session-log
    provider: jsonl
    config:
      path: .pi/session-log.jsonl
      maxEvents: 10000
      compression: false

  # Webhook 缝隙
  - name: webhook
    provider: http
    config:
      port: 3080
      authentication: false

  # 会话标题缝隙
  - name: session-title
    provider: llm
    config:
      maxLength: 50
      language: zh

  # Todo 缝隙
  - name: todo
    provider: store
    config:
      maxItems: 100

# 全局配置
global:
  logLevel: info
  sessionLog: true
  sessionLogPath: .pi/session-log.jsonl
